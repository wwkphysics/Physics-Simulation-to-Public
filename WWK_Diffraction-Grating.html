<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Explore diffraction-grating spectra at normal incidence with monochromatic or white light, grating spacing and screen overlap.">
<title>Diffraction Grating Simulator</title>
<style>
html{color-scheme:dark;background:#101a29}body{margin:0;padding:16px;box-sizing:border-box}main{max-width:1120px;margin:0 auto}button,input{font-family:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid #b5ecee;outline-offset:3px}@media(max-width:420px){body{padding:6px}}
</style>
</head>
<body>
<main>
<section id="wwk-grating-preview" aria-label="Diffraction Grating Simulator">
  <header class="wwk-title">
    <h1>Diffraction Grating Simulator</h1>
    <div class="wwk-formula"><span class="wwk-muted">Normal incidence</span><span><i>d</i> sin <i>θ</i> = <i>nλ</i></span></div>
  </header>
  <div class="wwk-layout">
    <div class="wwk-panel wwk-controls">
      <h2>Light source</h2>
      <div class="wwk-modes" aria-label="Light source">
        <button type="button" data-mode="white" aria-pressed="true">White light</button>
        <button type="button" data-mode="mono" aria-pressed="false">Monochromatic</button>
      </div>
      <div class="wwk-field">
        <label for="wwk-density">Grating density <output id="wwk-density-value">300 lines/mm</output></label>
        <input id="wwk-density" type="range" min="100" max="1000" step="10" value="300">
        <div class="wwk-spacing">
          <span>Grating spacing <i>d</i><small>Distance between adjacent lines</small></span>
          <output id="wwk-spacing" for="wwk-density">3.33 µm</output>
        </div>
      </div>
      <div class="wwk-field" id="wwk-wave-field" hidden>
        <label for="wwk-wave">Wavelength <output id="wwk-wave-value">532 nm</output></label>
        <input id="wwk-wave" type="range" min="400" max="700" step="1" value="532">
      </div>
      <div class="wwk-field">
        <label for="wwk-distance">Screen distance <output id="wwk-distance-value">1.5 m</output></label>
        <input id="wwk-distance" type="range" min="0.5" max="5" step="0.1" value="1.5">
      </div>
      <div class="wwk-readout" aria-live="polite">
        <div class="wwk-metric"><span>Highest order (<i>θ</i> &lt; 90°)</span><strong id="wwk-high"></strong></div>
        <div class="wwk-metric"><span>Orders on this screen</span><strong id="wwk-visible"></strong></div>
      </div>
    </div>
    <div class="wwk-views">
      <div class="wwk-panel">
        <div class="wwk-panel-head"><h2>Ray diagram</h2><span class="wwk-muted">Top view · schematic</span></div>
        <svg id="wwk-rays" role="img" aria-label="Diffracted rays reaching the screen" height="217"></svg>
      </div>
      <div class="wwk-panel">
        <div class="wwk-panel-head"><h2>Screen view</h2><span class="wwk-muted">Width 2.00 m</span></div>
        <canvas id="wwk-screen" role="img" aria-label="Simulated pattern on a two metre screen" width="960" height="92"></canvas>
        <div id="wwk-overlap-track" class="wwk-overlap-track" hidden aria-hidden="true"><span id="wwk-overlap-left"></span><span id="wwk-overlap-right"></span></div>
        <div class="wwk-ticks" aria-hidden="true"><span>−1.00 m</span><span>0</span><span>+1.00 m</span></div>
        <div class="wwk-status" id="wwk-status" aria-live="polite"></div>
        <div class="wwk-muted" id="wwk-key">Violet nearer the centre · red farther out</div>
      </div>
    </div>
  </div>
</section>
<style>
#wwk-grating-preview{font-family:system-ui,sans-serif;background:#101a29;color:#f2f7ff;padding:16px;border-radius:14px;font-size:14px;box-sizing:border-box}
#wwk-grating-preview [hidden]{display:none!important}
#wwk-grating-preview .wwk-title{padding-bottom:14px;margin-bottom:14px;border-bottom:1px solid #35465b;padding-right:68px}
#wwk-grating-preview h1{color:#f2f7ff;font-size:23px;font-weight:650;line-height:1.2;margin:0 0 8px}
#wwk-grating-preview .wwk-formula{display:flex;gap:8px 12px;align-items:center;flex-wrap:wrap}
#wwk-grating-preview .wwk-formula>span:last-child{color:#a9e9ec;background:#203d4b;border-radius:5px;padding:3px 8px}
#wwk-grating-preview h2{color:#eef3ff;font-size:14px;font-weight:600;margin:0}
#wwk-grating-preview .wwk-muted{font-size:12px;color:#b5bfd2}
#wwk-grating-preview .wwk-layout{display:grid;grid-template-columns:minmax(230px, .8fr) minmax(0,1.65fr);gap:12px}
#wwk-grating-preview .wwk-panel{background:#192639;border:1px solid #35465b;border-radius:10px;padding:13px;min-width:0}
#wwk-grating-preview .wwk-controls{align-self:start}
#wwk-grating-preview .wwk-views{display:grid;gap:12px;min-width:0}
#wwk-grating-preview .wwk-modes{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin:9px 0 13px;padding:3px;background:#232d3e;border-radius:7px}
#wwk-grating-preview button{min-height:42px;padding:5px;border:0;border-radius:5px;background:transparent;color:#e0e9f9;font:inherit;font-size:12px}
#wwk-grating-preview button[aria-pressed=true]{background:#b5ecee;color:#102933}
#wwk-grating-preview .wwk-field{margin:13px 0}
#wwk-grating-preview .wwk-field label{display:flex;justify-content:space-between;gap:4px;flex-wrap:wrap;font-size:12px}
#wwk-grating-preview output{color:#b5ecee;font-variant-numeric:tabular-nums}
#wwk-grating-preview input{width:100%;margin:4px 0;min-height:23px;accent-color:#8bdadc}
#wwk-grating-preview .wwk-spacing{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:4px 8px;background:#14202f;border-left:3px solid #8bdadc;border-radius:5px;padding:8px 9px;font-size:12px}
#wwk-grating-preview .wwk-spacing small{display:block;font-size:11px;color:#b5bfd2}
#wwk-grating-preview .wwk-spacing output{font-size:20px;font-weight:650;white-space:nowrap}
#wwk-grating-preview .wwk-readout{display:grid;gap:7px;border-top:1px solid #34405a;padding-top:10px;font-size:12px}
#wwk-grating-preview .wwk-metric{display:flex;align-items:baseline;justify-content:space-between;gap:2px 6px;flex-wrap:wrap}
#wwk-grating-preview .wwk-readout strong{font-weight:600;color:#b5ecee}
#wwk-grating-preview .wwk-status{color:#ffe1ac;font-size:12px;margin-bottom:4px}
#wwk-grating-preview .wwk-overlap-track{height:6px;margin-top:4px;position:relative}
#wwk-grating-preview .wwk-overlap-track span{position:absolute;top:0;height:4px;border-bottom:2px solid #ffcb77;border-inline:1px solid #ffcb77;box-sizing:border-box}
#wwk-grating-preview .wwk-panel-head{display:flex;justify-content:space-between;align-items:baseline;gap:6px;flex-wrap:wrap;margin-bottom:7px}
#wwk-grating-preview svg{display:block;width:100%;background:#0b1322;border-radius:4px}
#wwk-grating-preview canvas{display:block;width:100%;height:78px;background:#03050a;border-radius:4px}
#wwk-grating-preview .wwk-ticks{display:flex;justify-content:space-between;font-size:12px;color:#b5bfd2;margin:4px 0 6px;font-variant-numeric:tabular-nums}
@media(max-width:620px){#wwk-grating-preview .wwk-layout{grid-template-columns:minmax(0,1fr)}}
</style>
<script>
(() => {
  const root = document.getElementById('wwk-grating-preview');
  const get = id => root.querySelector('#wwk-' + id);
  const controls = {density:get('density'), wave:get('wave'), distance:get('distance')};
  const modes = [...root.querySelectorAll('[data-mode]')];
  const svg = get('rays'), canvas = get('screen'), ctx = canvas.getContext('2d');
  let mode = 'white';
  const ANGLE_LIMIT = 1 - 1e-12;
  const VIOLET = 400, RED = 700;
  const rgbStops = [[400,151,65,231],[440,78,102,255],[485,35,181,255],[510,35,223,171],[550,89,227,50],[580,249,224,50],[615,255,151,43],[650,255,78,63],[700,232,38,44]];
  function rgb(wave) {
    const k = Math.max(1, rgbStops.findIndex(stop=>stop[0]>=wave));
    const a = rgbStops[k-1], b = rgbStops[k], t = (wave-a[0])/(b[0]-a[0]);
    return [1,2,3].map(i=>Math.round(a[i]+t*(b[i]-a[i])));
  }
  function yAt(n, nm, spacing, distance) {
    const s = n * nm / spacing;
    return s < ANGLE_LIMIT ? distance * s / Math.sqrt(1-s*s) : Infinity;
  }
  function analyse(density, nm, distance, white) {
    const spacing = 1e6 / density;
    const highest = Math.ceil(spacing/(white ? VIOLET : nm)-1e-10)-1;
    const bands = [];
    for (let n=1;n<=highest;n++) {
      const start = yAt(n,white ? VIOLET : nm,spacing,distance);
      const end = white ? yAt(n,RED,spacing,distance) : start;
      if (start <= 1) bands.push({n, start, end:Math.min(1,end), clipped:end>1});
    }
    const overlaps = [];
    if (white) for (let j=0;j<bands.length;j++) for(let k=j+1;k<bands.length;k++) {
      const a=bands[j], b=bands[k];
      if (Math.min(a.end,b.end) > b.start + 1e-10) overlaps.push([a.n,b.n]);
    }
    return {spacing, highest, bands, overlaps, distance, nm, white};
  }
  function line(x1,y1,x2,y2,stroke,width=1,dash='') {
    return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+stroke+'" stroke-width="'+width+'" '+(dash?'stroke-dasharray="'+dash+'"':'')+'/>';
  }
  function drawRays(s) {
    const w = Math.max(250, Math.round(svg.getBoundingClientRect().width)), h = 217, mid = 114;
    const gx = 44, sx = w-42, py = y=>mid-y*82;
    const light = s.white ? '#fff' : 'rgb('+rgb(s.nm).join(',')+')';
    svg.setAttribute('viewBox','0 0 '+w+' '+h);
    let paths = line(12,mid,sx,mid,'#52617d',1,'4 4') + line(12,mid,gx,mid,light,3) +
      line(gx,mid-23,gx,mid+23,'#aebbd1',3,'3 3') + line(gx,mid,sx,mid,light,2);
    for (const band of [...s.bands].reverse()) {
      for (const sign of [-1,1]) {
        if (s.white) {
          const y1=py(sign*band.start), y2=py(sign*band.end);
          const a=Math.abs(band.end), bound=s.spacing*(a/Math.hypot(a,s.distance))/band.n;
          const c='rgb('+rgb(Math.min(RED,Math.max(VIOLET,bound))).join(',')+')';
          paths += '<path d="M'+gx+' '+mid+' L'+sx+' '+y1+' L'+sx+' '+y2+' Z" fill="#8054d1" opacity=".14"/>';
          paths += line(gx,mid,sx,y1,'#ad78ff',1.15);
          paths += line(gx,mid,sx,y2,c,1.15,band.clipped?'4 3':'');
        } else {
          paths += line(gx,mid,sx,py(sign*band.start),light,1.3);
        }
      }
    }
    paths+=line(sx,py(1),sx,py(-1),'#b7c6df',3);
    const label=(x,y,txt,anchor='start')=>'<text x="'+x+'" y="'+y+'" fill="#cbd8ef" font-size="11" text-anchor="'+anchor+'">'+txt+'</text>';
    svg.innerHTML=paths+label(gx,23,'Grating')+label(sx,23,'Screen','middle')+label(sx+6,mid+4,'n = 0')+label((gx+sx)/2,205,'L = '+s.distance.toFixed(1)+' m','middle');
  }
  function drawScreen(s) {
    const w=canvas.width, h=canvas.height;
    ctx.fillStyle='#03050a';ctx.fillRect(0,0,w,h);
    if (s.white) {
      for (let x=0;x<w;x++) {
        const y=Math.abs(2*(x+.5)/w-1);
        const sine=y/Math.hypot(y,s.distance);
        let colour=[3,5,10];
        for (const {n} of s.bands) {
          const nm=s.spacing*sine/n;
          if (nm>=VIOLET && nm<=RED) {
            const next=rgb(nm);
            colour=colour.map((c,i)=>255-(255-c)*(1-next[i]*.78/255));
          }
        }
        ctx.fillStyle='rgb('+colour.map(Math.round).join(',')+')';
        ctx.fillRect(x,0,1,h);
      }
    }
    const glow=(x,colour)=>{
      const g=ctx.createLinearGradient(x-7,0,x+7,0);
      g.addColorStop(0,'transparent');g.addColorStop(.5,colour);g.addColorStop(1,'transparent');
      ctx.fillStyle=g;ctx.fillRect(x-7,0,14,h);
    };
    const light=s.white?'#fff':'rgb('+rgb(s.nm).join(',')+')';
    if (!s.white) for(const {start} of s.bands) for(const sign of [-1,1]) glow((.5+sign*start/2)*w,light);
    glow(w/2,light);
  }
  function render() {
    const density=+controls.density.value, nm=+controls.wave.value, distance=+controls.distance.value;
    const s=analyse(density,nm,distance,mode==='white');
    get('density-value').textContent=density+' lines/mm';
    get('wave-value').textContent=nm+' nm';
    get('distance-value').textContent=distance.toFixed(1)+' m';
    get('spacing').textContent=(s.spacing/1000).toFixed(2)+' µm';
    get('wave-field').hidden=s.white;
    modes.forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===mode)));
    get('high').textContent=s.highest+(s.white?' (at least one colour)':'');
    get('visible').textContent=s.bands.length?'0, ±1'+(s.bands.length>1?' to ±'+s.bands.at(-1).n:''):'0 only';
    const partial = s.bands.some(b=>b.clipped);
    const pair = s.overlaps.some(([a,b])=>a===2 && b===3);
    get('overlap-track').hidden = !pair;
    if (pair) {
      const second = s.bands.find(b=>b.n===2), third = s.bands.find(b=>b.n===3);
      const start = third.start, end = Math.min(second.end,third.end);
      for (const [id, left] of [['overlap-left',.5-end/2],['overlap-right',.5+start/2]]) {
        const bracket = get(id);
        bracket.style.left = (100*left)+'%';
        bracket.style.width = (50*(end-start))+'%';
      }
    }
    if (s.white) {
      const selected = s.overlaps[0];
      get('status').textContent = pair ? 'Gold brackets: overlap of orders 2 and 3.' :
        selected ? 'Spectra overlap on screen: orders '+selected.join(' and ')+'.' :
        s.highest < 3 ? 'Order 3 does not form below 90° at this density.' :
        'The overlap of orders 2 and 3 is outside the screen.';
      get('key').textContent='400–700 nm · Violet nearer the centre'+(partial?' · Some bands extend beyond the screen.':' · Red farther out.');
    } else {
      const theta=Math.asin(nm/s.spacing)*180/Math.PI;
      get('status').textContent='First-order angle: '+theta.toFixed(1)+'°'+(s.bands.length?'':' (off screen)')+'.';
      get('key').textContent='Central maximum at 0 m · Side maxima occur in pairs.';
    }
    svg.setAttribute('aria-label','Ray diagram showing order zero and '+s.bands.length+' pairs of orders reaching the screen');
    canvas.setAttribute('aria-label','Screen pattern. '+get('visible').textContent+' orders visible. '+get('status').textContent);
    drawRays(s);drawScreen(s);
  }
  Object.values(controls).forEach(input=>input.addEventListener('input',render));
  modes.forEach(b=>b.addEventListener('click',()=>{mode=b.dataset.mode;render()}));
  new ResizeObserver(render).observe(svg);
  render();
})();
</script>

</main>
</body>
</html>
